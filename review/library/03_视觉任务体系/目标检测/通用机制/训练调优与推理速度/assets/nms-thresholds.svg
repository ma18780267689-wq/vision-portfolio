<svg xmlns="http://www.w3.org/2000/svg" width="380" height="468" viewBox="0 0 380 468" role="img" aria-labelledby="title desc" lang="zh-CN">
  <title id="title">同一对框，为什么少了一个？分开看 conf 和 NMS 的 IoU 阈值</title>
  <desc id="desc">同类候选框 A 分数为 0.90，B 为 0.65，两框的 IoU 为 0.60。基线：conf 0.50、NMS IoU 阈值 0.70，A、B 都保留。只把 conf 提高到 0.70，B 在去重之前就被筛掉。回到基线，只把 NMS IoU 阈值降低到 0.50，B 通过分数筛选，但因与高分框 A 重叠而被抑制。两个重叠框可能指向同一个物体，也可能是两个真实物体，要结合原图和标注判断。</desc>
  <style>
    text{font:16px "Microsoft YaHei","PingFang SC",system-ui,sans-serif;fill:#25362e}
    .heading{font-size:20px;font-weight:700}.key{font-weight:700}.small{font-size:15px}
    .a{stroke:#285b40;stroke-width:2.5;fill:none}.b{stroke:#98521b;stroke-width:2.5;stroke-dasharray:6 4;fill:none}
    .a-text{fill:#285b40}.b-text{fill:#83430f}.rule{stroke:#d2d9ce}
  </style>
  <rect width="380" height="468" rx="12" fill="#faf9f3"/>
  <text class="heading" x="16" y="32">同一对框，为什么少了一个？</text>
  <text class="small" x="16" y="57">标准同类 NMS：先查每个框的分数，再去重。</text>
  <rect x="19" y="74" width="112" height="50" fill="#e4eee1"/>
  <rect x="47" y="74" width="112" height="50" fill="#f3e6d5" fill-opacity=".65"/>
  <rect class="a" x="19" y="74" width="112" height="50"/>
  <rect class="b" x="47" y="74" width="112" height="50"/>
  <line class="a" x1="184" x2="206" y1="84" y2="84"/><text x="215" y="90" class="a-text">A：分数 0.90</text>
  <line class="b" x1="184" x2="206" y1="114" y2="114"/><text x="215" y="120" class="b-text">B：分数 0.65</text>
  <text x="16" y="150">两框 IoU = 0.60，以下三次都不变。</text>
  <line class="rule" x1="16" x2="364" y1="166" y2="166"/>
  <text class="key" x="16" y="192">基线：conf 0.50，NMS 阈值 0.70</text>
  <text x="16" y="217">两框分数均达标，0.60 未超过 0.70。</text>
  <text class="key a-text" x="16" y="241">结果：A、B 都留下。</text>
  <line class="rule" x1="16" x2="364" y1="254" y2="254"/>
  <text class="key" x="16" y="280">只提高 conf：0.50 → 0.70</text>
  <text x="16" y="305">B 的分数 0.65 不足，没走到去重。</text>
  <text class="key b-text" x="16" y="329">结果：只留 A。B 输在分数。</text>
  <line class="rule" x1="16" x2="364" y1="342" y2="342"/>
  <text class="key" x="16" y="368">回到基线，只降低 NMS 阈值至 0.50</text>
  <text x="16" y="393">两框分数仍达标，但 0.60 超过 0.50。</text>
  <text class="key b-text" x="16" y="417">结果：只留 A。B 被高分框 A 抑制。</text>
  <text class="small" x="16" y="441">同一物体的重复框，还是挨着的两个物体？</text>
  <text class="small" x="16" y="460">只看 IoU 无法判断，要回到原图和标注。</text>
</svg>
