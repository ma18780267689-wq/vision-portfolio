<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" role="img" aria-labelledby="title desc"><title id="title">FPN 的跨尺度连接</title><desc id="desc">深层20乘20特征经上采样与40乘40主干特征融合，继续与80乘80特征融合。横向连接引入主干细节。</desc><style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#202e29;font-size:16px} .node{fill:#fffef9;stroke:#b8c5b9;stroke-width:1.2}.focus{fill:#e6eee2;stroke:#245b44;stroke-width:1.2}.path{fill:none;stroke:#245b44;stroke-width:1.5;marker-end:url(#arrow)}.neutral{fill:none;stroke:#b8c5b9;stroke-width:1.2}.small{font-size:14px;fill:#58665f}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#245b44"/></marker></defs><text x="80" y="26" text-anchor="middle">主干特征</text><text x="280" y="26" text-anchor="middle">自顶向下</text><rect class="node" x="18" y="64" width="124" height="48" rx="6"/><text x="80" y="94" text-anchor="middle">20×20</text><rect class="focus" x="218" y="64" width="124" height="48" rx="6"/><text x="280" y="94" text-anchor="middle">20×20</text><path class="path" d="M142 88 H216"/><rect class="node" x="18" y="174" width="124" height="48" rx="6"/><text x="80" y="204" text-anchor="middle">40×40</text><rect class="focus" x="218" y="174" width="124" height="48" rx="6"/><text x="280" y="204" text-anchor="middle">40×40</text><path class="path" d="M142 198 H216"/><rect class="node" x="18" y="284" width="124" height="48" rx="6"/><text x="80" y="314" text-anchor="middle">80×80</text><rect class="focus" x="218" y="284" width="124" height="48" rx="6"/><text x="280" y="314" text-anchor="middle">80×80</text><path class="path" d="M142 308 H216"/><path class="path" d="M280 112 V172"/><path class="path" d="M280 222 V282"/><text x="200" y="148" text-anchor="middle" class="small">上采样</text><text x="200" y="258" text-anchor="middle" class="small">上采样</text><text x="180" y="375" text-anchor="middle" class="small">深层信息向高分辨率层传播</text></svg>
