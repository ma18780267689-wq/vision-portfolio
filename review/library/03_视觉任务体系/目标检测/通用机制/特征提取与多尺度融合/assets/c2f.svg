<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 464" role="img" aria-labelledby="title desc"><title id="title">C2f：保留中间输出再拼接</title><desc id="desc">一路依次经过两个Bottleneck，保留两条起始分支与各次中间输出，然后拼接并混合。图中两次重复仅为示意。</desc><style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#202e29;font-size:16px} .node{fill:#fffef9;stroke:#b8c5b9;stroke-width:1.2}.focus{fill:#e6eee2;stroke:#245b44;stroke-width:1.2}.path{fill:none;stroke:#245b44;stroke-width:1.5;marker-end:url(#arrow)}.neutral{fill:none;stroke:#b8c5b9;stroke-width:1.2}.small{font-size:14px;fill:#58665f}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#245b44"/></marker></defs><text x="180" y="24" text-anchor="middle">输入</text><path class="path" d="M180 32 V46"/><rect class="node" x="106" y="48" width="148" height="42" rx="6"/><text x="180" y="75" text-anchor="middle">1×1 卷积</text><path class="path" d="M180 90 V106"/><text x="180" y="126" text-anchor="middle">分成两部分</text><path class="path" d="M180 140 H48 V326 H113"/><path class="path" d="M180 140 H246 V154"/><rect class="focus" x="179" y="156" width="134" height="42" rx="6"/><text x="246" y="183" text-anchor="middle">Bottleneck 1</text><path class="path" d="M246 198 V220"/><rect class="focus" x="179" y="222" width="134" height="42" rx="6"/><text x="246" y="249" text-anchor="middle">Bottleneck 2</text><path class="path" d="M246 264 V326 H247"/><path class="path" d="M246 140 H344 V298 H268 V326 H247"/><path class="neutral" d="M313 177 H344"/><text x="90" y="218" text-anchor="middle" class="small">保留</text><rect class="node" x="115" y="304" width="130" height="44" rx="6"/><text x="180" y="332" text-anchor="middle">Concat</text><path class="path" d="M180 348 V364"/><rect class="node" x="108" y="366" width="144" height="42" rx="6"/><text x="180" y="393" text-anchor="middle">1×1 混合</text><text x="180" y="445" text-anchor="middle" class="small">内块依次计算；保留中间输出</text></svg>
