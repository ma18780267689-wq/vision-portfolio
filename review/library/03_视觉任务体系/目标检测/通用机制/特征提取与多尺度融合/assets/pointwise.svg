<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img" aria-labelledby="title desc"><title id="title">1乘1卷积混合通道</title><desc id="desc">普通groups等于1的1乘1卷积在同一位置对输入通道加权组合，得到输出通道。同一组权重在所有空间位置共享，步长1时不改变宽高。</desc><style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#202e29;font-size:16px} .node{fill:#fffef9;stroke:#b8c5b9;stroke-width:1.2}.focus{fill:#e6eee2;stroke:#245b44;stroke-width:1.2}.path{fill:none;stroke:#245b44;stroke-width:1.5;marker-end:url(#arrow)}.neutral{fill:none;stroke:#b8c5b9;stroke-width:1.2}.small{font-size:14px;fill:#58665f}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#245b44"/></marker></defs><text x="180" y="24" text-anchor="middle">同一个空间位置</text><rect class="node" x="12" y="48" width="70" height="42" rx="6"/><text x="47" y="75" text-anchor="middle">x1</text><path class="path" d="M47 90 V112 L180 142"/><rect class="node" x="100" y="48" width="70" height="42" rx="6"/><text x="135" y="75" text-anchor="middle">x2</text><path class="path" d="M135 90 V112 L180 142"/><rect class="node" x="188" y="48" width="70" height="42" rx="6"/><text x="223" y="75" text-anchor="middle">x3</text><path class="path" d="M223 90 V112 L180 142"/><rect class="node" x="276" y="48" width="70" height="42" rx="6"/><text x="311" y="75" text-anchor="middle">x4</text><path class="path" d="M311 90 V112 L180 142"/><rect class="focus" x="90" y="146" width="180" height="48" rx="6"/><text x="180" y="176" text-anchor="middle">共享的权重矩阵 W</text><path class="path" d="M180 194 V212 H104 V230"/><path class="path" d="M180 212 H256 V230"/><rect class="node" x="60" y="232" width="88" height="42" rx="6"/><text x="104" y="259" text-anchor="middle">y1</text><rect class="node" x="212" y="232" width="88" height="42" rx="6"/><text x="256" y="259" text-anchor="middle">y2</text><text x="180" y="310" text-anchor="middle" class="small">混合通道；不额外读取邻近位置</text></svg>
