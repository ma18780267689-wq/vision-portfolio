<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" role="img" aria-labelledby="title desc"><title id="title">C3：两路变换后拼接</title><desc id="desc">C3的一条投影支路经过一串Bottleneck，另一条走短路径，两者拼接后用1乘1卷积混合。</desc><style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#202e29;font-size:16px} .node{fill:#fffef9;stroke:#b8c5b9;stroke-width:1.2}.focus{fill:#e6eee2;stroke:#245b44;stroke-width:1.2}.path{fill:none;stroke:#245b44;stroke-width:1.5;marker-end:url(#arrow)}.neutral{fill:none;stroke:#b8c5b9;stroke-width:1.2}.small{font-size:14px;fill:#58665f}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#245b44"/></marker></defs><text x="180" y="28" text-anchor="middle">输入</text><path class="path" d="M180 36 V54 H80 V74"/><path class="path" d="M180 54 H280 V74"/><rect class="node" x="18" y="76" width="124" height="44" rx="6"/><text x="80" y="104" text-anchor="middle">1×1 卷积</text><rect class="node" x="218" y="76" width="124" height="44" rx="6"/><text x="280" y="104" text-anchor="middle">1×1 卷积</text><path class="path" d="M80 120 V160"/><rect class="focus" x="5" y="162" width="150" height="60" rx="6"/><text x="80" y="198" text-anchor="middle">Bottleneck×n</text><path class="path" d="M80 222 V278 H126"/><path class="path" d="M280 120 V278 H234"/><rect class="node" x="128" y="256" width="104" height="44" rx="6"/><text x="180" y="284" text-anchor="middle">Concat</text><path class="path" d="M180 300 V328"/><rect class="node" x="110" y="330" width="140" height="44" rx="6"/><text x="180" y="358" text-anchor="middle">1×1 混合</text><text x="240" y="184" text-anchor="middle" class="small">短路径</text></svg>
