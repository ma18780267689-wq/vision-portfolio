<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 296" role="img" aria-labelledby="title desc"><title id="title">同一预测位置的宽高先验与最终预测</title><desc id="desc">在一个网格位置重复放置不同宽高模板，网络学习相对模板的调整后得到预测框。这些模板不是真实标注，也不是已经发现的目标。</desc><style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#202e29;font-size:16px} .node{fill:#fffef9;stroke:#b8c5b9;stroke-width:1.2}.focus{fill:#e6eee2;stroke:#245b44;stroke-width:1.2}.path{fill:none;stroke:#245b44;stroke-width:1.5;marker-end:url(#arrow)}.neutral{fill:none;stroke:#b8c5b9;stroke-width:1.2}.small{font-size:14px;fill:#58665f}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#245b44"/></marker></defs><rect x="22" y="34" width="150" height="170" fill="none" stroke="#b8c5b9"/><path class="neutral" d="M72 34 V204 M122 34 V204 M22 91 H172 M22 148 H172"/><rect x="73" y="75" width="48" height="88" fill="none" stroke="#8a4c15"/><rect x="52" y="98" width="90" height="42" fill="none" stroke="#58665f"/><rect x="64" y="86" width="66" height="66" fill="none" stroke="#245b44"/><circle cx="97" cy="119" r="4" fill="#202e29"/><path class="path" d="M182 119 H218"/><rect x="235" y="67" width="100" height="108" fill="#e6eee2" stroke="#245b44"/><circle cx="285" cy="121" r="4" fill="#202e29"/><text x="98" y="235" text-anchor="middle" class="small">同一位置的形状模板</text><text x="284" y="235" text-anchor="middle" class="small">调整后的预测</text><text x="202" y="102" text-anchor="middle" class="small">回归</text><text x="180" y="278" text-anchor="middle" class="small">不代表三种尺度或三个已知目标</text></svg>
