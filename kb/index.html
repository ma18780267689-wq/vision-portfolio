<!DOCTYPE html>
<html lang="zh">
<head><meta name="viewport" content="width=device-width,initial-scale=1">
    <meta charset="utf-8">
    <title>My KB · 马志成</title>
    <!-- 引入极简风格的高级无衬线字体 -->
    
    <!-- p5.js 用于底层算法艺术生成 -->
    <script src="/vision-portfolio/kb/vendor/p5.min.js"></script>
    <style>
        /* =========================================================================
           Theme Factory: Modern Minimalist Light (现代极简浅色风)
           设计理念: 纯净通透、光影交错、字形优美
           ========================================================================= */
        :root {
            /* 核心调色板 */
            --color-bg: #fafaf8;
            --color-surface: #fafaf8bf;
            --color-border: #fafaf899;
            --color-text-main: #232726;
            --color-text-muted: #2f6556;
            --color-accent: #2f6556;      
            
            /* 字体规范 */
            --font-display: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--color-bg);
            font-family: var(--font-body);
            color: var(--color-text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* 背景氛围修饰：两个缓慢移动的柔和渐变色块 */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.5;
            animation: drift 20s infinite alternate;
        }
        .blob-1 {
            width: 450px;
            height: 450px;
            background: #fafaf8; /* 淡蓝色 */
            top: -100px;
            right: -100px;
        }
        .blob-2 {
            width: 550px;
            height: 550px;
            background: #fafaf8; /* 淡灰蓝色 */
            bottom: -200px;
            left: -150px;
            animation-duration: 25s;
            animation-direction: alternate-reverse;
        }

        @keyframes drift {
            0% { transform: translate(0, 0); }
            100% { transform: translate(80px, -50px); }
        }

        /* p5.js 画布容器：包裹底层，赋予一定的交互权重 */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: auto; /* 必须接收鼠标事件 */
        }

        /* -------------------------------------------------------------------------
           Frontend Design: Glassmorphism 中心组件区
           ------------------------------------------------------------------------- */
        .hero-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none; /* 让鼠标穿透，触发画板交互 */
        }

        .glass-card {
            background: var(--color-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--color-border);
            border-radius: 32px;
            padding: 5rem 6rem;
            text-align: center;
            max-width: 850px;
            box-shadow: 0 20px 50px #2327260a, 0 1px 3px #23272605;
            pointer-events: auto; /* 恢复自身及子元素的交互 */
            
            /* 出现动画 */
            transform: translateY(30px);
            opacity: 0;
            animation: floatUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.1s;
        }

        @keyframes floatUp {
            to { transform: translateY(0); opacity: 1; }
        }

        h1 {
            font-family: var(--font-display);
            font-weight: 300;
            font-size: 3.5rem;
            letter-spacing: -1.5px;
            margin: 0 0 1.5rem 0;
            line-height: 1.15;
        }

        h1 strong {
            font-weight: 600;
            background: linear-gradient(135deg, #232726 30%, #2f6556 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 1.15rem;
            color: var(--color-text-muted);
            font-weight: 300;
            margin-bottom: 3.5rem;
            line-height: 1.7;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
            letter-spacing: 0.2px;
        }

        .btn-enter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--color-text-main);
            color: #fafaf8;
            font-family: var(--font-body);
            font-weight: 400;
            font-size: 1.1rem;
            padding: 1.25rem 3rem;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 20px #23272614;
            position: relative;
        }

        .btn-enter::after {
            content: "→";
            margin-left: 10px;
            transition: transform 0.3s ease;
        }

        .btn-enter:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 20px 30px #23272626;
            background-color: #232726;
        }

        .btn-enter:hover::after {
            transform: translateX(4px);
        }

        .quick-links {
            display: flex;
            justify-content: center;
            gap: 0.9rem;
            flex-wrap: wrap;
            margin-top: 1.1rem;
        }

        .quick-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.8rem 1.25rem;
            border-radius: 50px;
            text-decoration: none;
            color: var(--color-text-main);
            background: #fafaf8b8;
            border: 1px solid #fafaf8e6;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 20px #2327260a;
        }

        .quick-link:hover {
            transform: translateY(-2px);
            border-color: #2f655633;
            box-shadow: 0 16px 28px #23272614;
        }

        .metrics {
            margin-top: 3.5rem;
            display: flex;
            justify-content: center;
            gap: 4rem;
            border-top: 1px solid var(--color-border);
            padding-top: 2.5rem;
            opacity: 0;
            animation: fadeIn 1.5s ease forwards;
            animation-delay: 0.8s;
        }
        
        .metric-item {
            text-align: center;
        }

        .metric-value {
            display: block;
            font-family: var(--font-display);
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--color-accent);
            margin-bottom: 0.2rem;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--color-text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
<link rel="stylesheet" href="kb-portfolio.css"><script defer src="kb-portfolio.js"></script></head>
<body>
    <!-- 装饰球 -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    
    <!-- P5.js 动态画布 -->
    <div id="canvas-container"></div>
    
    <!-- 毛玻璃交互卡片 -->
    <div class="hero-container">
        <div class="glass-card">
            <h1>My KB<br><strong>个人知识库</strong></h1>
            <p class="subtitle">围绕 Agent 与深度学习整理知识，通过世界模型视图关联阅读。</p>
            <div class="quick-links"><a href="domains/agent/_index/" class="quick-link">Agent 领域</a>
                <a href="views/world-model/" class="quick-link">世界模型视图</a>
                <a href="domains/deep-learning/_index/" class="quick-link">深度学习领域</a>
            </div>
            
            <div class="metrics">
                <div class="metric-item">
                    <span class="metric-value">2</span>
                    <span class="metric-label">知识领域</span>
                </div>
                <div class="metric-item">
                    <span class="metric-value">4</span>
                    <span class="metric-label">世界模型泳道</span>
                </div>
                <div class="metric-item">
                    <span class="metric-value">全文</span>
                    <span class="metric-label">检索与关联阅读</span>
                </div>
            </div>
        </div>
    </div>

    <!-- =======================================================================
         Algorithmic Art: 基于力的知识节点网络 (Semantic Flow Forcefield)
         设计理念: 
         整个页面本身就像一个巨大的“世界环境”，由无数个“事实与机制节点”构成随机的连结。
         您的鼠标就充当着“Agent行动者”的角色，当鼠标介入时（行动），节点会受到力场的排斥或吸引
         产生“回响与演化”，完美呼应知识库里的 WM 核心理念。
         ======================================================================= -->
    <script>
        let nodes = [];
        let numNodes;
        const connectionDistance = 160;
        
        function setup() {
            let canvas = createCanvas(windowWidth, windowHeight);
            canvas.parent('canvas-container');
            
            // 响应式节点数量
            numNodes = innerWidth < 768 ? 50 : 130;
            for (let i = 0; i < numNodes; i++) {
                nodes.push(new Node());
            }
        }

        function draw() {
            clear(); // 透明背景，让下面的 CSS blob 透上来
            
            // 当前 Agent（鼠标）的位置向量
            let agentVec = createVector(mouseX, mouseY);
            
            // 绘制“机制连接线” (Connections)
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    let d = dist(nodes[i].pos.x, nodes[i].pos.y, nodes[j].pos.x, nodes[j].pos.y);
                    if (d < connectionDistance) {
                        // 距离越近，线条越不透明
                        let alpha = map(d, 0, connectionDistance, 120, 0);
                        stroke(47, 101, 86, alpha); // 浅灰蓝色的细线
                        strokeWeight(0.6);
                        line(nodes[i].pos.x, nodes[i].pos.y, nodes[j].pos.x, nodes[j].pos.y);
                    }
                }
            }
            
            // 更新并绘制所有“知识节点” (Nodes)
            for (let node of nodes) {
                node.interact(agentVec);
                node.update();
                node.display();
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            // 简单处理尺寸突变时散失的节点
            if (width > windowWidth) {
                nodes.forEach(n => { n.pos.x = min(n.pos.x, windowWidth); n.pos.y = min(n.pos.y, windowHeight);});
            }
        }

        class Node {
            constructor() {
                this.pos = createVector(random(width), random(height));
                this.vel = p5.Vector.random2D().mult(random(0.05, 0.2));
                this.baseSize = random(2.5, 6.5);
                this.size = this.baseSize;
                this.phase = random(TWO_PI);
                this.pulseSpeed = random(0.01, 0.04);
            }
            
            interact(agentVec) {
                // Agent 介入（干预与回响反馈机制）
                // 此时鼠标充当 Agent 带来了干预力场
                let d = p5.Vector.dist(this.pos, agentVec);
                let interactionRadius = 200; // 影响半径

                if (d > 0 && d < interactionRadius) {
                    // Agent排斥力 (反向移动)
                    let force = p5.Vector.sub(this.pos, agentVec);
                    force.normalize();
                    // 距离中心越近，力越大
                    let strength = map(d, 0, interactionRadius, 1.2, 0);
                    force.mult(strength);
                    this.vel.add(force);
                    
                    // 被 Agent 激活时节点变大
                    this.size = lerp(this.size, this.baseSize * 1.8, 0.1);
                } else {
                    // 恢复自然状态
                    this.size = lerp(this.size, this.baseSize, 0.05);
                }
                
                // 世界自身的“自然演变规律” (Perlin Noise)
                let noiseAngle = noise(this.pos.x * 0.003, this.pos.y * 0.003, frameCount * 0.001) * TWO_PI * 4;
                let drift = p5.Vector.fromAngle(noiseAngle).mult(0.08); // 这个乘数控制自然流淌的强度
                this.vel.add(drift);
                
                // 阻尼摩擦力，防止越跑越快
                this.vel.mult(0.96);
            }
            
            update() {
                this.pos.add(this.vel);
                this.phase += this.pulseSpeed;
                
                // 边界循环处理 (无边界宇宙)
                let margin = 50;
                if (this.pos.x < -margin) this.pos.x = width + margin;
                if (this.pos.x > width + margin) this.pos.x = -margin;
                if (this.pos.y < -margin) this.pos.y = height + margin;
                if (this.pos.y > height + margin) this.pos.y = -margin;
            }
            
            display() {
                noStroke();
                
                // 外层呼吸光晕
                let breath = map(sin(this.phase), -1, 1, 0.3, 1);
                fill(47, 101, 86, 255 * breath * 0.5); // --color-accent 带有一定透明度
                circle(this.pos.x, this.pos.y, this.size * 2);
                
                // 内核实体
                fill(35, 39, 38, 220); // 深色核心
                circle(this.pos.x, this.pos.y, this.size * 0.8);
            }
        }
    </script>
</body>
</html>
